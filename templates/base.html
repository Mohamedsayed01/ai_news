<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapNews — AI News Summarizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }

        body {
            background-image: url('{{ url_for("static", filename="images/newswall.jpg") }}');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .overlay {
            background: rgba(248,250,252,0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .overlay { background: rgba(8,12,24,0.92); }

        /* Cards */
        .card-hover {
            transition: transform 0.3s cubic-bezier(.34,1.2,.64,1), box-shadow 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-8px) scale(1.018);
            box-shadow: 0 20px 50px -12px rgba(0,0,0,0.15);
        }

        /* Nav */
        .logo-img { height:48px; width:auto; transition:transform 0.3s; }
        .logo-img:hover { transform:scale(1.06); }
        .nav-link { position:relative; padding-bottom:2px; }
        .nav-link::after {
            content:''; position:absolute; bottom:0; left:0;
            width:0; height:2px; background:#2563eb; border-radius:2px;
            transition:width 0.2s ease;
        }
        .nav-link:hover::after { width:100%; }

        /* Animations */
        #savedPanel { transition: transform 0.35s cubic-bezier(.34,1.2,.64,1); }
        .fade-in { opacity:0; transform:translateY(24px); animation:fadeUp 0.6s ease forwards; }
        @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

        /* ════════════════════════════════════════
           BRIEFING STYLES
        ════════════════════════════════════════ */
        .sn-briefing {
            display: flex;
            flex-direction: column;
            gap: 14px;
            font-size: 14.5px;
            line-height: 1.75;
        }

        /* Each section block */
        .sn-briefing > div {
            border-radius: 14px;
            padding: 14px 18px;
            position: relative;
        }

        /* Labels */
        .sn-label {
            display: block;
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 7px;
        }

        /* Bottom Line */
        .sn-bottom-line {
            background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%);
            border-left: 4px solid #2563eb;
        }
        .sn-bottom-line .sn-label { color: #1d4ed8; }
        .sn-bottom-line p { color: #1e3a6e; font-weight: 600; font-size: 15px; margin:0; }
        .dark .sn-bottom-line { background: linear-gradient(135deg, #1e3a5f 0%, #1e1b4b 100%); }
        .dark .sn-bottom-line p { color: #bfdbfe; }
        .dark .sn-bottom-line .sn-label { color: #93c5fd; }

        /* Key Facts */
        .sn-facts {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .sn-facts .sn-label { color: #0369a1; }
        .sn-facts ul {
            list-style: none;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; gap: 8px;
        }
        .sn-facts ul li {
            padding-left: 22px;
            position: relative;
            color: #334155;
            font-size: 14px;
        }
        .sn-facts ul li::before {
            content: '›';
            position: absolute; left: 6px; top: 0;
            color: #2563eb; font-size: 16px; font-weight: 700;
            line-height: 1.6;
        }
        .dark .sn-facts { background: #0f172a; border-color: #1e293b; }
        .dark .sn-facts .sn-label { color: #38bdf8; }
        .dark .sn-facts ul li { color: #cbd5e1; }
        .dark .sn-facts ul li::before { color: #60a5fa; }

        /* Context */
        .sn-context {
            background: #f0fdf4;
            border: 1px solid #d1fae5;
        }
        .sn-context .sn-label { color: #059669; }
        .sn-context p { color: #1e4d3b; margin: 0; font-size: 14px; }
        .dark .sn-context { background: #052e16; border-color: #14532d; }
        .dark .sn-context p { color: #a7f3d0; }
        .dark .sn-context .sn-label { color: #34d399; }

        /* What to Watch */
        .sn-watch {
            background: #fff7ed;
            border: 1px solid #fed7aa;
        }
        .sn-watch .sn-label { color: #c2410c; }
        .sn-watch p { color: #431407; margin: 0; font-size: 14px; font-style: italic; }
        .dark .sn-watch { background: #1c0a00; border-color: #7c2d12; }
        .dark .sn-watch p { color: #fdba74; }
        .dark .sn-watch .sn-label { color: #fb923c; }

        /* Source badge */
        .sn-source-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #64748b;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 3px 10px;
        }
        .dark .sn-source-badge { background: #1e293b; border-color: #334155; color: #94a3b8; }
        .sn-source-badge.full { color: #16a34a; border-color: #bbf7d0; background: #f0fdf4; }
        .dark .sn-source-badge.full { background: #052e16; border-color: #14532d; color: #4ade80; }
    </style>
</head>
<body class="text-gray-900 dark:text-gray-100 min-h-screen">

<!-- Navbar -->
<nav class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-b border-gray-200 dark:border-slate-700 sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-6 py-3.5 flex items-center gap-5">
        <a href="/" class="shrink-0">
            <img src="{{ url_for('static', filename='images/weblogo.png') }}" alt="SnapNews" class="logo-img">
        </a>

        <form action="/search" method="GET" class="flex-1 max-w-lg">
            <div class="relative">
                <input type="text" name="q"
                       value="{{ request.args.get('q', '') }}"
                       placeholder="Search all news…"
                       class="w-full bg-gray-100 dark:bg-slate-800 border border-transparent focus:border-blue-500 rounded-full py-2.5 px-5 pl-10 text-sm outline-none transition dark:text-white dark:placeholder-gray-400">
                <svg class="absolute left-3.5 top-3 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
                </svg>
            </div>
        </form>

        <div class="flex items-center gap-4 text-sm font-medium shrink-0 ml-auto">
            <a href="/" class="nav-link text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition">Home</a>
            <a href="/about" class="nav-link text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition">About</a>

            <button onclick="toggleSavedPanel()" class="relative p-1.5 text-gray-600 dark:text-gray-300 hover:text-blue-600 transition" title="Saved">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                </svg>
                <span id="savedBadge" style="display:none"
                      class="absolute -top-1 -right-1 bg-blue-600 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold"></span>
            </button>

            <button onclick="toggleDark()" id="darkBtn"
                    class="p-1.5 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700 transition">
                <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.36-6.36-.71.71M6.34 17.66l-.71.71M17.66 17.66l-.71-.71M6.34 6.34l-.71-.71M12 5a7 7 0 1 0 0 14A7 7 0 0 0 12 5z"/>
                </svg>
            </button>
        </div>
    </div>
</nav>

<!-- Page Content -->
<div class="overlay min-h-[calc(100vh-68px)]">
    {% block content %}{% endblock %}
</div>

<!-- Footer -->
<footer class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-t border-gray-200 dark:border-slate-700 py-10">
    <div class="max-w-6xl mx-auto px-6 text-center">
        <p class="text-xl font-bold text-blue-700 dark:text-blue-400">SnapNews</p>
        <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">Premium AI News Summarization · Powered by Google Gemini</p>
        <div class="flex justify-center gap-6 mt-5 text-xs text-gray-400">
            <a href="/" class="hover:text-blue-600 transition">Home</a>
            <a href="/about" class="hover:text-blue-600 transition">About</a>
        </div>
        <p class="text-[11px] text-gray-300 dark:text-gray-700 mt-5">© 2026 SnapNews. All rights reserved.</p>
    </div>
</footer>

<!-- ═══════════════ Summary Modal ═══════════════ -->
<div id="summaryModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-xl w-full shadow-2xl max-h-[92vh] flex flex-col overflow-hidden border border-gray-100 dark:border-slate-700">

        <!-- Modal Header -->
        <div class="px-6 py-4 flex justify-between items-start bg-gradient-to-r from-blue-700 to-indigo-600 shrink-0">
            <div class="pr-4">
                <p class="text-[10px] font-bold uppercase tracking-widest text-blue-200 mb-1">AI Briefing</p>
                <h3 id="modalTitle" class="font-semibold text-white text-[15px] leading-snug line-clamp-2"></h3>
            </div>
            <button onclick="closeModal()"
                    class="shrink-0 w-7 h-7 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/25 transition text-white text-xl leading-none mt-0.5">
                ×
            </button>
        </div>

        <!-- Modal Body -->
        <div id="modalSummary" class="p-6 overflow-y-auto flex-1 text-gray-700 dark:text-gray-200"></div>

        <!-- Modal Footer -->
        <div id="modalFooter" class="px-6 py-4 border-t border-gray-100 dark:border-slate-700 bg-gray-50 dark:bg-slate-800/50 shrink-0 hidden">
            <div class="flex gap-2">
                <a id="modalReadLink" href="#" target="_blank" rel="noopener"
                   class="flex-1 text-center bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2.5 rounded-xl transition">
                    📖 Read Full Article
                </a>
                <button id="modalShareBtn"
                        class="px-4 border border-gray-200 dark:border-slate-600 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-xl text-sm font-semibold transition dark:text-white">
                    🔗 Share
                </button>
                <button onclick="closeModal()"
                        class="px-4 border border-gray-200 dark:border-slate-600 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-xl text-sm font-semibold transition dark:text-white">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ═══════════════ Saved Panel ═══════════════ -->
<div id="savedPanel"
     class="fixed top-0 right-0 h-full w-80 bg-white dark:bg-slate-900 shadow-2xl z-50 flex flex-col translate-x-full border-l border-gray-200 dark:border-slate-700">
    <div class="px-5 py-4 flex justify-between items-center bg-gradient-to-r from-blue-700 to-indigo-600 text-white shrink-0">
        <span class="font-bold text-sm">Saved Articles</span>
        <button onclick="toggleSavedPanel()"
                class="w-6 h-6 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/25 transition text-xl leading-none">×</button>
    </div>
    <div id="savedList" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    <div class="p-4 border-t border-gray-100 dark:border-slate-700 shrink-0">
        <button onclick="clearSaved()"
                class="w-full py-2.5 text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-xl transition font-medium">
            🗑 Clear All Saved
        </button>
    </div>
</div>
<div id="savedOverlay" class="hidden fixed inset-0 bg-black/40 z-40" onclick="toggleSavedPanel()"></div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
